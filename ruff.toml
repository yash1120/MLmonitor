line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # long lines in prompts/HTML are fine
    "SIM105", # try/except/pass is clearer than contextlib.suppress here
]

[lint.per-file-ignores]
"tests/*" = ["B011"]
