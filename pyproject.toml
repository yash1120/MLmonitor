[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlmonitor"
version = "0.3.0"
description = "Agentic MLOps monitor: drift detection + LLM diagnosis + gated retraining"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "pydantic==2.10.3",
    "pydantic-settings==2.6.1",
    "scikit-learn==1.5.2",
    "numpy==2.1.3",
    "pandas==2.2.3",
    "scipy==1.14.1",
    "pyarrow>=17,<19",
    "mlflow==2.18.0",
    "azure-ai-ml==1.22.0",
    "azure-identity==1.19.0",
    "langchain==0.3.9",
    "langchain-core==0.3.21",
    "langchain-groq==0.2.1",
    "langgraph==0.2.53",
    "httpx==0.28.1",
    "python-dotenv==1.0.1",
    "sqlalchemy==2.0.36",
    "joblib==1.4.2",
    "prometheus-client==0.21.1",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "pytest-cov==6.0.0", "ruff>=0.6"]
# Heavyweight, optional: only needed to regenerate the Evidently comparison benchmark.
benchmark = ["evidently>=0.4"]

[project.scripts]
mlmonitor-train = "mlmonitor.cli:train"
mlmonitor-monitor = "mlmonitor.cli:monitor"
mlmonitor-seed = "mlmonitor.cli:seed"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "SIM105"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
