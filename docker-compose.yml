services:
  api:
    build: .
    image: agentic-mlops-monitor:latest
    container_name: mlmonitor-api
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  mlflow-ui:
    image: ghcr.io/mlflow/mlflow:v2.18.0
    container_name: mlmonitor-mlflow-ui
    command: >
      mlflow ui
        --backend-store-uri sqlite:////mlflow/mlflow.db
        --host 0.0.0.0
        --port 5000
    ports:
      - "5000:5000"
    volumes:
      - ./data:/mlflow
    depends_on:
      - api
