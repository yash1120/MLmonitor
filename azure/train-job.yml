$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
type: command

display_name: agentic-mlops-monitor-train
experiment_name: ml-monitor
description: |
  Retrains the baseline churn model and logs metrics to MLflow on Azure ML.
  Triggered by GitHub Actions when the monitoring agent confirms drift.

code: ../
command: >
  pip install -r requirements.txt &&
  PYTHONPATH=src python scripts/train_baseline.py

environment:
  image: mcr.microsoft.com/azureml/openmpi4.1.0-ubuntu22.04
  conda_file: environment.yml

compute: serverless
resources:
  instance_type: Standard_DS3_v2
  instance_count: 1

tags:
  project: agentic-mlops-monitor
  pipeline_stage: retrain
