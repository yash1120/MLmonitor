$schema: https://azuremlschemas.azureedge.net/latest/managedOnlineDeployment.schema.json
name: blue
endpoint_name: agentic-mlops-monitor
description: Blue deployment serving the FastAPI monitoring service.

model:
  name: churn-baseline
  version: latest

environment:
  image: agentic-mlops-monitor:latest
  inference_config:
    liveness_route:
      path: /healthz
      port: 8000
    readiness_route:
      path: /healthz
      port: 8000
    scoring_route:
      path: /predict
      port: 8000

instance_type: Standard_DS3_v2
instance_count: 1

request_settings:
  request_timeout_ms: 30000
  max_concurrent_requests_per_instance: 4
liveness_probe:
  initial_delay: 30
  period: 30
  timeout: 5
  failure_threshold: 3
