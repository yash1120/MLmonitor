name: retrain

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why retraining was triggered (filled by the monitoring agent)"
        required: false
        default: "manual run"

permissions:
  contents: read

jobs:
  retrain:
    runs-on: ubuntu-latest
    env:
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
      MLFLOW_EXPERIMENT_NAME: ml-monitor
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
      AZURE_WORKSPACE_NAME: ${{ secrets.AZURE_WORKSPACE_NAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Log trigger
        # Bind the untrusted input to an env var so it is passed as DATA, never
        # template-expanded into the shell (avoids Actions script injection).
        env:
          REASON: ${{ github.event.inputs.reason }}
        run: |
          echo "Retraining triggered: $REASON"

      - name: Train challenger and promote only if it beats the champion
        run: |
          PYTHONPATH=src python scripts/promote_model.py

      - name: Run drift tests
        run: |
          PYTHONPATH=src pytest tests -q

      - name: Login to Azure
        if: env.AZURE_SUBSCRIPTION_ID != ''
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Submit Azure ML training job
        if: env.AZURE_SUBSCRIPTION_ID != ''
        env:
          REASON: ${{ github.event.inputs.reason }}
        run: |
          az extension add --name ml --yes --upgrade
          az ml job create \
            --file azure/train-job.yml \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --workspace-name "$AZURE_WORKSPACE_NAME" \
            --set tags.trigger_reason="$REASON"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: baseline-model
          path: data/baseline_model.joblib
          if-no-files-found: warn
